server:
  port: 0
  servlet:
    context-path: ""
spring:
  datasource:
    url: jdbc:h2:mem:authorization;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS auth\;SET SCHEMA auth
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: auth
  liquibase:
    default-schema: auth
    change-log: db/changelog/db.changelog-master.yaml
    enabled: true
management:
  server:
    port: 0
jwt:
  secret: bank-ddd-test-jwt-secret-key-32-bytes-minimum
  lifetime: PT1H
eureka:
  client:
    enabled: false
