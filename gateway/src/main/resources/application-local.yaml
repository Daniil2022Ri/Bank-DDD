management:
  server:
    port: 8180
  endpoint:
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
spring:
  cloud:
    gateway:
      routes:
        - id: authorization
          uri: ${AUTHORIZATION_URI:http://localhost:8087}
          predicates:
            - Path=/api/authorization/**
        - id: profile
          uri: ${PROFILE_URI:http://localhost:8089}
          predicates:
            - Path=/api/profile/**
        - id: account
          uri: ${ACCOUNT_URI:http://localhost:8085}
          predicates:
            - Path=/api/account/**
        - id: antifraud
          uri: ${ANTIFRAUD_URI:http://localhost:8086}
          predicates:
            - Path=/api/anti-fraud/**
        - id: transfer
          uri: ${TRANSFER_URI:http://localhost:8092}
          predicates:
            - Path=/api/transfer/**
        - id: history
          uri: ${HISTORY_URI:http://localhost:8088}
          predicates:
            - Path=/api/history/**
        - id: public-info
          uri: ${PUBLIC_INFO_URI:http://localhost:8091}
          predicates:
            - Path=/api/public-info/**
jwt:
  secret: ${JWT_SECRET:bank-ddd-local-jwt-secret-key-32-bytes-min}
