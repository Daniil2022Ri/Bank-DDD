server:
  port: 8086
  servlet:
    context-path: /api/anti-fraud
management:
  server:
    port: 8186
  endpoint:
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/postgres?currentSchema=anti_fraud
    username: postgres
    password: password
    hikari:
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS anti_fraud
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: anti_fraud
  liquibase:
    default-schema: anti_fraud
    change-log: db/changelog/db.changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}
    drop-first: ${LIQUIBASE_DROP_FIRST:false}
  application:
    name: anti-fraud-app
